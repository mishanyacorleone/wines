# Шлюз: одна точка входа на :8080 для всех сервисов.
#
#   /v1/auth, /v1/me, /v1/achievements, /v1/admin, /v1/avatars, /v1/media, /v1/map, /v1/settings → users (аккаунт, карта, настройки)
#   /v1/events, /v1/admin/analytics                                        → analytics (дашборд РСХБ)
#   всё остальное (/v1/eval/predict, /v1/scan, /app/, /catalog-images/ …)  → api (распознавание)
#
# Один адрес для браузера: cookie сессии и запросы страницы без CORS.
# Контракт организатора (POST /v1/eval/predict на :8080) не меняется — шлюз
# просто передаёт запрос сервису распознавания.

server {
  listen 8080;
  server_name _;

  # Адреса сервисов спрашиваем у DNS Docker на каждый запрос (не чаще раза в
  # 10 с), а не один раз при старте: пересозданный контейнер (docker compose
  # up -d api) получает новый IP, и шлюз со старым адресом отдавал бы 502.
  # Переменная в proxy_pass — то, что заставляет nginx разрешать имя заново
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8080;
  set $users http://users:8000;
  set $analytics http://analytics:8001;

  # Сжатие текста: контуры винной карты (~0,5 МБ JSON) уходят в 3–4 раза меньше
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # Фото с телефона — до 25 МБ (лимит сервиса распознавания); у nginx по умолчанию 1 МБ
  client_max_body_size 26m;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Ответ распознавания — до пары секунд, первый после старта — дольше
  proxy_read_timeout 120s;

  # Раньше общего /v1/admin: из локаций-регулярок nginx берёт первую совпавшую
  location ~ ^/v1/(events|admin/analytics)(/|$) {
    proxy_pass $analytics;
  }

  location ~ ^/v1/(auth|me|achievements|admin|avatars|media|map|settings)(/|$) {
    proxy_pass $users;
  }

  location / {
    proxy_pass $api;
  }
}
