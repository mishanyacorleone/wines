# Шлюз: одна точка входа на :8080, только маршрутизация.
#
#   /app/, /catalog-images/, /site-media/, /        → web (статика: страница, фото бутылок и справочников)
#   /v1/events, /v1/admin/analytics                  → analytics (дашборд РСХБ)
#   /v1/admin/catalog                                → catalog (синхронизация каталога с сайтом)
#   /v1/auth, /v1/me, /v1/achievements, /v1/admin,
#   /v1/avatars, /v1/media, /v1/map, /v1/settings    → users (аккаунт, карта, настройки)
#   остальные /v1/, /health, /docs                   → api (распознавание, карточки, сомелье)
#   /internal/                                       → никуда: служебные ручки только внутри сети
#
# Один адрес для браузера: cookie сессии и запросы страницы без CORS.
# Контракт организатора (POST /v1/eval/predict на :8080) не меняется.
#
# Сервис не отвечает (упал, перезапускается) — шлюз отдаёт JSON с понятным
# текстом вместо HTML-страницы nginx: страница сканера показывает его как есть,
# а пользователь остаётся на сайте.

# Журнал: только запросы к API, одной строкой; номер запроса — тот же, что в логах сервисов
log_format wines '$request_method $uri → $status за ${request_time}s '
                 '(сервис ${upstream_response_time}s, клиент $remote_addr) [$request_id_short]';

map $request_id $request_id_short {
  "~^(?<head>.{8})" $head;
}

server {
  listen 8080;
  server_name _;

  resolver 127.0.0.11 valid=10s ipv6=off;
  # Адреса сервисов спрашиваем у DNS Docker на каждый запрос (не чаще раза в
  # 10 с), а не один раз при старте: пересозданный контейнер получает новый IP,
  # а шлюз стартует, даже если какого-то сервиса сейчас нет.
  # Переменная в proxy_pass — то, что заставляет nginx разрешать имя заново
  set $api http://api:8080;
  set $users http://users:8000;
  set $analytics http://analytics:8001;
  set $catalog http://catalog:8002;
  set $web http://web:8080;

  access_log /dev/stdout wines;
  error_log /dev/stderr error;

  # Сжатие текста: контуры винной карты (~0,5 МБ JSON) уходят в 3–4 раза меньше
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/json application/javascript text/css image/svg+xml;
  # Ответ зависит от Accept-Encoding — кэшам по пути это нужно знать (файлы с версией хранятся год)
  gzip_vary on;

  # Фото с телефона — до 25 МБ (лимит сервиса распознавания); у nginx по умолчанию 1 МБ.
  # Буфер в памяти — под типичное фото: иначе nginx пишет каждое во временный файл
  # и предупреждает об этом в логе
  client_max_body_size 26m;
  client_body_buffer_size 8m;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id_short;
  proxy_connect_timeout 3s;
  # Ответ распознавания — до пары секунд, синхронизация каталога отвечает сразу
  proxy_read_timeout 120s;
  proxy_intercept_errors off;

  # Своя проверка шлюза: не зависит от того, живы ли сервисы за ним
  location = /gateway-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /internal/ {
    return 404;
  }

  location = /health {
    access_log off;
    error_page 502 503 504 = @api_down;
    proxy_pass $api;
  }

  # Раньше общего /v1/admin: из локаций-регулярок nginx берёт первую совпавшую
  location ~ ^/v1/(events|admin/analytics)(/|$) {
    error_page 502 503 504 = @analytics_down;
    proxy_pass $analytics;
  }

  location ~ ^/v1/admin/catalog(/|$) {
    error_page 502 503 504 = @catalog_down;
    proxy_pass $catalog;
  }

  location ~ ^/v1/(auth|me|achievements|admin|avatars|media|map|settings|quiz|challenges|gifts)(/|$) {
    error_page 502 503 504 = @users_down;
    proxy_pass $users;
  }

  location /v1/ {
    error_page 502 503 504 = @api_down;
    proxy_pass $api;
  }

  # Документация API распознавания (Swagger)
  location ~ ^/(docs|openapi\.json)$ {
    access_log off;
    error_page 502 503 504 = @api_down;
    proxy_pass $api;
  }

  # Статика: в журнал не пишется — строка на каждую картинку только мешает
  location / {
    access_log off;
    error_page 502 503 504 = @web_down;
    proxy_pass $web;
  }

  location @api_down {
    default_type application/json;
    return 503 '{"detail": "Сервис распознавания и каталога временно недоступен — попробуйте через минуту. Личный кабинет и карта работают"}';
  }
  location @users_down {
    default_type application/json;
    return 503 '{"detail": "Личный кабинет временно недоступен — попробуйте через минуту. Сканер работает"}';
  }
  location @analytics_down {
    default_type application/json;
    return 503 '{"detail": "Сервис аналитики временно недоступен"}';
  }
  location @catalog_down {
    default_type application/json;
    return 503 '{"detail": "Сервис каталога временно недоступен"}';
  }
  location @web_down {
    default_type text/html;
    return 503 '<!doctype html><meta charset="utf-8"><title>Своё Вино</title><p style="font:16px sans-serif;margin:40px">Сайт перезапускается — обновите страницу через минуту.</p>';
  }
}
