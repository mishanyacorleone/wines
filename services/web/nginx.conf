# Сервис web: только статика — страница сканера /app/ и фото бутылок каталога.
#
# Отдельно от api: страница, личный кабинет, карта и «Поделиться» открываются,
# даже когда api или модели перезапускаются (сканер тогда пишет «распознавание
# временно недоступно»). Код страницы — services/web/app, подключён томом:
# правка вёрстки видна сразу, без пересборки.

# Файл с версией (?v=<хэш содержимого>, tools/web-assets/stamp.py) не меняется никогда —
# браузер хранит его год и не переспрашивает. Без версии (index.html, значки) — сверяется
# при каждом открытии: так правка вёрстки видна сразу
map $arg_v $app_cache {
  ""      "no-cache";
  default "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;

  # Журнал доступа ведёт шлюз; строка на каждую картинку здесь — шум
  access_log off;
  # Редиректы относительные: за шлюзом хост и порт видит только он
  absolute_redirect off;

  location = / {
    return 302 /app/;
  }

  location = /health {
    default_type text/plain;
    return 200 "ok\n";
  }

  location /app/ {
    alias /srv/app/;
    index index.html;
    add_header Cache-Control $app_cache;
  }

  # Фото бутылок: data/catalog/images, пополняется синхронизацией каталога. Страница берёт
  # превью WebP (h600/, h900/ — строит парсер каталога), оригинал PNG — если превью нет
  location /catalog-images/ {
    alias /srv/catalog-images/;
    expires 7d;
  }

  # Фото блюд, регионов и сортов — локальные копии картинок сайта: страница
  # не зависит от того, отвечает ли сайт
  location /site-media/ {
    alias /srv/site-media/;
    expires 30d;
  }

  location / {
    return 404;
  }
}
